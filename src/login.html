<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartKitchen - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <header>
        <span class="logo">Smart<span>Kitchen</span></span>
    </header>

    <main style="max-width: 420px;">

        <div class="page-title">
            <h1>Iniciar Sesión</h1>
            <p>Accede a tu cuenta de SmartKitchen.</p>
        </div>

        <section>
            <form id="form-login">

                <div class="form-group">
                    <label for="correo-login">Correo electrónico *</label>
                    <input type="email" id="correo-login" name="correo"
                           placeholder="tu@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="password-login">Contraseña *</label>
                    <input type="password" id="password-login" name="password"
                           placeholder="Mínimo 6 caracteres" required>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">Ingresar</button>
                </div>

                <p class="form-note" style="margin-top: 12px;">
                    ¿No tienes cuenta? <a href="#">Regístrate aquí</a>
                </p>

            </form>
        </section>

    </main>

    <footer>
        <p>SmartKitchen &copy; 2026 — Grupo 2 — SOFT-06 CENFOTEC</p>
    </footer>

    <script src="js/login.js"></script>
</body>
</html>
